<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#31506F"/></marker>
    <style>
      .title{font:700 38px 'Segoe UI',Arial;fill:#fff}.subtitle{font:18px 'Segoe UI',Arial;fill:#CFE8FF}
      .section{font:700 22px 'Segoe UI',Arial;fill:#102A43}.head{font:700 18px 'Segoe UI',Arial;fill:#102A43}
      .body{font:15px 'Segoe UI',Arial;fill:#334E68}.small{font:13px 'Segoe UI',Arial;fill:#486581}
      .whiteHead{font:700 20px 'Segoe UI',Arial;fill:#fff}.whiteBody{font:14px 'Segoe UI',Arial;fill:#D9EAF7}
      .edge{stroke:#31506F;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#F4F8FC"/>
  <rect width="1600" height="128" fill="#0B3A67"/>
  <rect y="120" width="1600" height="8" fill="#0078D4"/>
  <text x="72" y="62" class="title">Azure landing zone platform</text>
  <text x="72" y="96" class="subtitle">Governed foundation for identity, subscriptions, connectivity, security, and operations</text>
  <text x="1510" y="62" text-anchor="end" class="subtitle">REFERENCE ARCHITECTURE</text>

  <rect x="520" y="162" width="560" height="86" rx="14" fill="#E6F2FC" stroke="#0078D4" stroke-width="3"/>
  <circle cx="576" cy="205" r="25" fill="#0078D4"/>
  <path d="M562 205h28M576 191v28" stroke="#fff" stroke-width="4"/>
  <text x="620" y="198" class="section">Microsoft Entra tenant</text>
  <text x="620" y="225" class="body">Identity boundary, billing relationship, and Azure resource hierarchy</text>

  <path d="M800 248V290" class="edge"/>
  <rect x="110" y="290" width="1380" height="180" rx="18" fill="#fff" stroke="#7B9AB8" stroke-width="2"/>
  <text x="150" y="330" class="section">Resource organization</text>
  <text x="150" y="358" class="body">Management groups apply consistent policy and access to subscriptions with similar requirements.</text>

  <rect x="160" y="385" width="265" height="58" rx="10" fill="#DCEEFF" stroke="#0078D4"/>
  <text x="292" y="420" text-anchor="middle" class="head">Platform</text>
  <rect x="480" y="385" width="265" height="58" rx="10" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="612" y="420" text-anchor="middle" class="head">Landing Zones</text>
  <rect x="800" y="385" width="265" height="58" rx="10" fill="#FFF7E0" stroke="#B7791F"/>
  <text x="932" y="420" text-anchor="middle" class="head">Sandbox</text>
  <rect x="1120" y="385" width="265" height="58" rx="10" fill="#FDEDEF" stroke="#C62828"/>
  <text x="1252" y="420" text-anchor="middle" class="head">Decommissioned</text>

  <path d="M800 470V510" class="edge"/>
  <text x="800" y="544" text-anchor="middle" class="section">Shared platform capabilities</text>

  <rect x="110" y="575" width="310" height="170" rx="16" fill="#EEF7FF" stroke="#4098D7" stroke-width="2"/>
  <circle cx="158" cy="620" r="24" fill="#0078D4"/>
  <text x="158" y="627" text-anchor="middle" fill="#fff" font-family="Segoe UI" font-weight="700">ID</text>
  <text x="200" y="614" class="head">Identity and access</text>
  <text x="145" y="661" class="body">Entra groups • RBAC scope</text>
  <text x="145" y="689" class="body">PIM • Conditional Access</text>
  <text x="145" y="717" class="body">Deployment identity • Emergency access</text>

  <rect x="465" y="575" width="310" height="170" rx="16" fill="#EEFAF0" stroke="#2E7D32" stroke-width="2"/>
  <circle cx="513" cy="620" r="24" fill="#2E7D32"/>
  <text x="513" y="627" text-anchor="middle" fill="#fff" font-family="Segoe UI" font-weight="700">MG</text>
  <text x="555" y="614" class="head">Management</text>
  <text x="500" y="661" class="body">Log Analytics • Activity Logs</text>
  <text x="500" y="689" class="body">Alerts • Backup • Recovery</text>
  <text x="500" y="717" class="body">Service health • Operational ownership</text>

  <rect x="820" y="575" width="310" height="170" rx="16" fill="#FFF7E0" stroke="#B7791F" stroke-width="2"/>
  <circle cx="868" cy="620" r="24" fill="#B7791F"/>
  <text x="868" y="627" text-anchor="middle" fill="#fff" font-family="Segoe UI" font-weight="700">NW</text>
  <text x="910" y="614" class="head">Connectivity</text>
  <text x="855" y="661" class="body">Hub • Peering • Routing • Egress</text>
  <text x="855" y="689" class="body">DNS • Private endpoints</text>
  <text x="855" y="717" class="body">Firewall • Bastion • Hybrid links</text>

  <rect x="1175" y="575" width="310" height="170" rx="16" fill="#FFF0F5" stroke="#C2185B" stroke-width="2"/>
  <circle cx="1223" cy="620" r="24" fill="#C2185B"/>
  <text x="1223" y="627" text-anchor="middle" fill="#fff" font-family="Segoe UI" font-weight="700">SC</text>
  <text x="1265" y="614" class="head">Security</text>
  <text x="1210" y="661" class="body">Defender posture • Findings</text>
  <text x="1210" y="689" class="body">Encryption • Key ownership</text>
  <text x="1210" y="717" class="body">SIEM integration • Incident response</text>

  <rect x="190" y="790" width="1220" height="78" rx="16" fill="#102A43"/>
  <text x="800" y="823" text-anchor="middle" class="whiteHead">Guardrails and automation across every subscription</text>
  <text x="800" y="850" text-anchor="middle" class="whiteBody">Azure Policy • RBAC • Naming • Tags • Budgets • Diagnostic settings • Terraform • CI/CD</text>

  <path d="M800 868V900" class="edge"/>
  <rect x="355" y="900" width="890" height="64" rx="14" fill="#fff" stroke="#7B8794" stroke-width="2"/>
  <text x="800" y="928" text-anchor="middle" class="head">Operate the platform as a product</text>
  <text x="800" y="950" text-anchor="middle" class="small">Ownership • Change control • Compliance • Cost • Monitoring • Recovery • Continuous improvement</text>
</svg>
